<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{empresa}}</title>
<style>
  :root { --c: {{color}}; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; color: #1f2937; line-height: 1.5; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
  header b { font-size: 1.2rem; }
  .hero { padding: 72px 24px; text-align: center; color: #fff; background: var(--c, #2563eb) center/cover no-repeat; background-image: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url('{{portada}}'); }
  .hero h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 0 0 8px; }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .card { border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #f3f4f6; }
  .card div { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card .price { font-weight: 700; color: var(--c, #2563eb); }
  .card button { margin-top: auto; background: var(--c, #2563eb); }
  footer { background: #f9fafb; padding: 32px 24px; text-align: center; }
  footer a { color: var(--c, #2563eb); }
</style>
</head>
<body>
  <header><b>{{empresa}}</b>{{carrito}}</header>
  <section class="hero">
    <h1>{{titulo}}</h1>
    <p>{{subtitulo}}</p>
  </section>
  <main>
    <h2>Catálogo</h2>
    <div class="grid">
      {{#productos}}
      <article class="card">
        <img src="{{imagen}}" alt="{{nombre}}" loading="lazy">
        <div>
          <h3>{{nombre}}</h3>
          <p>{{descripcion}}</p>
          <span class="price">{{precio}}</span>
          {{comprar}}
        </div>
      </article>
      {{/productos}}
    </div>
    <h2>Sobre nosotros</h2>
    <p>{{sobre}}</p>
  </main>
  <footer>
    <p><a href="{{whatsapp}}">WhatsApp</a> · {{email}}</p>
    <small>© {{empresa}}</small>
  </footer>
</body>
</html>
